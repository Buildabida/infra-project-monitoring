# Databricks job that runs the full pipeline, from setup to the dashboard refresh.
# databricks.yml includes this file, so `databricks bundle deploy` manages the job.
# See resources/README.md before you deploy it.
resources:
  jobs:
    buildabida_full_pipeline:
      name: buildabida-full-pipeline
      # one run at a time: every layer replaces or merges the same tables
      max_concurrent_runs: 1
      # 4 hours. The longest task on October 16, 2026 took 28m 32s, and a 31-notebook
      # run on October 14 took about 85 minutes. A hung run stops here instead of
      # using up the workspace's daily serverless quota. Raise it if real runs need more
      timeout_seconds: 14400
      email_notifications:
        on_failure:
          - ${var.alert_email}
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: set_up
          notebook_task:
            notebook_path: ../notebooks/00_setup/00_setup_workspace.sql
          environment_key: Default
        - task_key: check_sources
          depends_on:
            - task_key: set_up
          notebook_task:
            notebook_path: ../notebooks/00_setup/01_check_sources.py
          environment_key: Default
        - task_key: bronze_boundaries
          depends_on:
            - task_key: check_sources
          notebook_task:
            notebook_path: ../notebooks/01_bronze/05_bronze_boundaries.py
          environment_key: Default
        - task_key: bronze_census_table_c
          depends_on:
            - task_key: check_sources
          notebook_task:
            notebook_path: ../notebooks/01_bronze/04_bronze_census_table_c.py
          environment_key: Default
        - task_key: bronze_dpwh_projects
          depends_on:
            - task_key: check_sources
          notebook_task:
            notebook_path: ../notebooks/01_bronze/01_bronze_dpwh_projects.py
          environment_key: Default
        - task_key: bronze_flood_control
          depends_on:
            - task_key: check_sources
          notebook_task:
            notebook_path: ../notebooks/01_bronze/02_bronze_flood_control.py
          environment_key: Default
        - task_key: bronze_flood_susceptibility
          depends_on:
            - task_key: check_sources
          notebook_task:
            notebook_path: ../notebooks/01_bronze/06_bronze_flood_susceptibility.py
          environment_key: Default
        - task_key: bronze_psgc
          depends_on:
            - task_key: check_sources
          notebook_task:
            notebook_path: ../notebooks/01_bronze/03_bronze_psgc.py
          environment_key: Default
        - task_key: bronze_validation
          depends_on:
            - task_key: bronze_dpwh_projects
            - task_key: bronze_flood_control
            - task_key: bronze_census_table_c
            - task_key: bronze_flood_susceptibility
            - task_key: bronze_boundaries
            - task_key: bronze_psgc
          notebook_task:
            notebook_path: ../notebooks/04_validation/01_validation_bronze.py
          environment_key: Default
        - task_key: gold_dim_date
          depends_on:
            - task_key: set_up
          notebook_task:
            notebook_path: ../notebooks/03_gold/00_gold_dim_date.ipynb
          environment_key: Default
        - task_key: silver_config_mappings
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/02_silver/00_config_mappings.ipynb
          environment_key: Default
        - task_key: silver_flood_control_component
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/02_silver/06_silver_flood_control_component.ipynb
          environment_key: Default
        - task_key: silver_mgb_flood_area
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/02_silver/08a_silver_mgb_flood_area.ipynb
          environment_key: Default
        - task_key: silver_psgc_place
          depends_on:
            - task_key: bronze_validation
          notebook_task:
            notebook_path: ../notebooks/02_silver/01_silver_psgc_place.ipynb
          environment_key: Default
        - task_key: silver_validation_config_mappings
          depends_on:
            - task_key: silver_config_mappings
          notebook_task:
            notebook_path: ../notebooks/04_validation/02_validation_silver_config.ipynb
          environment_key: Default
        - task_key: silver_dpwh_project_component
          depends_on:
            - task_key: bronze_validation
            - task_key: silver_validation_config_mappings
          notebook_task:
            notebook_path: ../notebooks/02_silver/04_silver_dpwh_project_component.ipynb
          environment_key: Default
        - task_key: silver_project
          depends_on:
            - task_key: silver_dpwh_project_component
          notebook_task:
            notebook_path: ../notebooks/02_silver/05_silver_project.ipynb
          environment_key: Default
        - task_key: silver_population_place_reconciliation
          depends_on:
            - task_key: silver_psgc_place
            - task_key: silver_validation_config_mappings
          notebook_task:
            notebook_path: ../notebooks/02_silver/02_silver_population_place_reconciliation.ipynb
          environment_key: Default
        - task_key: silver_region_population
          depends_on:
            - task_key: silver_population_place_reconciliation
          notebook_task:
            notebook_path: ../notebooks/02_silver/03_silver_region_population.ipynb
          environment_key: Default
        - task_key: silver_validation_geography_population
          depends_on:
            - task_key: silver_region_population
          notebook_task:
            notebook_path: ../notebooks/04_validation/03_validation_silver_geography_population.ipynb
          environment_key: Default
        - task_key: silver_province_reporting_area
          depends_on:
            - task_key: silver_validation_geography_population
          notebook_task:
            notebook_path: ../notebooks/02_silver/01a_silver_province_reporting_area.ipynb
          environment_key: Default
        - task_key: silver_province_reporting_area_population
          depends_on:
            - task_key: silver_province_reporting_area
            - task_key: silver_validation_geography_population
          notebook_task:
            notebook_path: ../notebooks/02_silver/03a_silver_province_reporting_area_population.ipynb
          environment_key: Default
        - task_key: silver_validation_mgb_flood_area
          depends_on:
            - task_key: silver_mgb_flood_area
          notebook_task:
            notebook_path: ../notebooks/04_validation/06a_validation_silver_mgb_flood_area.ipynb
          environment_key: Default
        - task_key: silver_region_flood_exposure
          depends_on:
            - task_key: silver_validation_mgb_flood_area
            - task_key: silver_validation_geography_population
            - task_key: silver_validation_config_mappings
          notebook_task:
            notebook_path: ../notebooks/02_silver/09_silver_region_flood_exposure.ipynb
          environment_key: Default
        - task_key: silver_validation_projects
          depends_on:
            - task_key: silver_dpwh_project_component
            - task_key: silver_project
            - task_key: silver_flood_control_component
          notebook_task:
            notebook_path: ../notebooks/04_validation/04_validation_silver_projects.ipynb
          environment_key: Default
        - task_key: gold_dim_project_status
          depends_on:
            - task_key: silver_validation_projects
            - task_key: silver_validation_config_mappings
          notebook_task:
            notebook_path: ../notebooks/03_gold/03_gold_dim_project_status.ipynb
          environment_key: Default
        - task_key: silver_project_flood_map
          depends_on:
            - task_key: silver_validation_projects
            - task_key: silver_validation_mgb_flood_area
            - task_key: silver_validation_config_mappings
          notebook_task:
            notebook_path: ../notebooks/02_silver/10_silver_project_flood_map.ipynb
          environment_key: Default
        - task_key: silver_validation_project_flood_map
          depends_on:
            - task_key: silver_project_flood_map
          notebook_task:
            notebook_path: ../notebooks/04_validation/08_validation_silver_project_flood_map.ipynb
          environment_key: Default
        - task_key: gold_dim_flood_susceptibility
          depends_on:
            - task_key: silver_validation_config_mappings
            - task_key: silver_validation_project_flood_map
          notebook_task:
            notebook_path: ../notebooks/03_gold/02_gold_dim_flood_susceptibility.ipynb
          environment_key: Default
        - task_key: silver_project_region_map
          depends_on:
            - task_key: silver_validation_projects
            - task_key: silver_validation_geography_population
            - task_key: silver_validation_config_mappings
          notebook_task:
            notebook_path: ../notebooks/02_silver/08_silver_project_region_map.ipynb
          environment_key: Default
        - task_key: silver_validation_project_region_map
          depends_on:
            - task_key: silver_project_region_map
          notebook_task:
            notebook_path: ../notebooks/04_validation/06_validation_silver_project_region_map.ipynb
          environment_key: Default
        - task_key: silver_project_province_map
          depends_on:
            - task_key: silver_province_reporting_area
            - task_key: silver_validation_projects
            - task_key: silver_validation_config_mappings
            - task_key: silver_validation_project_region_map
          notebook_task:
            notebook_path: ../notebooks/02_silver/08c_silver_project_province_map.ipynb
          environment_key: Default
        - task_key: silver_validation_province_reporting
          depends_on:
            - task_key: silver_project_province_map
            - task_key: silver_province_reporting_area_population
            - task_key: silver_validation_geography_population
          notebook_task:
            notebook_path: ../notebooks/04_validation/03b_validation_silver_province_reporting.ipynb
          environment_key: Default
        - task_key: silver_project_source_match
          depends_on:
            - task_key: silver_validation_projects
          notebook_task:
            notebook_path: ../notebooks/02_silver/07_silver_project_source_match.ipynb
          environment_key: Default
        - task_key: silver_validation_region_flood_exposure
          depends_on:
            - task_key: silver_region_flood_exposure
          notebook_task:
            notebook_path: ../notebooks/04_validation/07_validation_silver_region_flood_exposure.ipynb
          environment_key: Default
        - task_key: gold_dim_region
          depends_on:
            - task_key: silver_validation_region_flood_exposure
            - task_key: silver_validation_geography_population
          notebook_task:
            notebook_path: ../notebooks/03_gold/01_gold_dim_region.ipynb
          environment_key: Default
        - task_key: gold_dim_province_reporting_area
          depends_on:
            - task_key: gold_dim_region
            - task_key: silver_validation_province_reporting
          notebook_task:
            notebook_path: ../notebooks/03_gold/01a_gold_dim_province_reporting_area.ipynb
          environment_key: Default
        - task_key: gold_fact_region_population
          depends_on:
            - task_key: gold_dim_region
            - task_key: gold_dim_flood_susceptibility
            - task_key: silver_validation_geography_population
          notebook_task:
            notebook_path: ../notebooks/03_gold/05_gold_fact_region_population.ipynb
          environment_key: Default
        - task_key: gold_fact_province_reporting_area_population
          depends_on:
            - task_key: gold_dim_province_reporting_area
            - task_key: silver_validation_province_reporting
          notebook_task:
            notebook_path: ../notebooks/03_gold/05a_gold_fact_province_reporting_area_population.ipynb
          environment_key: Default
        - task_key: gold_fact_region_flood_exposure
          depends_on:
            - task_key: gold_dim_region
            - task_key: gold_dim_flood_susceptibility
            - task_key: silver_validation_region_flood_exposure
          notebook_task:
            notebook_path: ../notebooks/03_gold/06_gold_fact_region_flood_exposure.ipynb
          environment_key: Default
        - task_key: silver_validation_source_reconciliation
          depends_on:
            - task_key: silver_project_source_match
          notebook_task:
            notebook_path: ../notebooks/04_validation/05_validation_silver_source_reconciliation.ipynb
          environment_key: Default
        - task_key: gold_dim_project
          depends_on:
            - task_key: silver_validation_projects
            - task_key: silver_validation_source_reconciliation
          notebook_task:
            notebook_path: ../notebooks/03_gold/04_gold_dim_project.ipynb
          environment_key: Default
        - task_key: gold_fact_project_snapshot
          depends_on:
            - task_key: silver_validation_projects
            - task_key: gold_dim_project_status
            - task_key: gold_dim_province_reporting_area
            - task_key: gold_dim_region
            - task_key: gold_dim_date
            - task_key: gold_dim_project
            - task_key: silver_validation_project_region_map
            - task_key: silver_validation_project_flood_map
            - task_key: gold_dim_flood_susceptibility
            - task_key: silver_validation_province_reporting
          notebook_task:
            notebook_path: ../notebooks/03_gold/07_gold_fact_project_snapshot.ipynb
          environment_key: Default
        - task_key: gold_validation
          depends_on:
            - task_key: gold_fact_project_snapshot
            - task_key: gold_fact_region_flood_exposure
            - task_key: gold_fact_region_population
          notebook_task:
            notebook_path: ../notebooks/04_validation/09_validation_gold.ipynb
          environment_key: Default
        - task_key: gold_validation_province_reporting
          depends_on:
            - task_key: gold_validation
            - task_key: gold_fact_province_reporting_area_population
          notebook_task:
            notebook_path: ../notebooks/04_validation/09a_validation_gold_province_reporting.ipynb
          environment_key: Default
        - task_key: analytics
          depends_on:
            - task_key: gold_validation
            - task_key: gold_validation_province_reporting
          notebook_task:
            notebook_path: ../notebooks/05_analytics/01_business_questions.ipynb
          environment_key: Default
        - task_key: analytics_validation
          depends_on:
            - task_key: analytics
          notebook_task:
            notebook_path: ../notebooks/04_validation/10_validation_analytics.ipynb
          environment_key: Default
        - task_key: publish_acceptance_evidence
          depends_on:
            - task_key: analytics_validation
          notebook_task:
            notebook_path: ../notebooks/04_validation/11_publish_acceptance_evidence.sql
          environment_key: Default
        - task_key: end_to_end_quality_gate
          depends_on:
            - task_key: publish_acceptance_evidence
          # runs even after an earlier failure, so its result records why the run stopped.
          # it fails unless every validator passed for this run, which blocks the dashboard
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/06_data_quality/01_end_to_end_quality_gate.py
            base_parameters:
              job_run_id: "{{job.run_id}}"
          environment_key: Default
        - task_key: business_dashboard
          depends_on:
            - task_key: analytics_validation
            - task_key: publish_acceptance_evidence
            - task_key: end_to_end_quality_gate
          # refreshes the dashboard only. The exported subscription had no subscribers and
          # an attachment field the bundle schema does not support, so it was removed
          dashboard_task:
            warehouse_id: ${var.warehouse_id}
            dashboard_id: ${var.dashboard_id}
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
