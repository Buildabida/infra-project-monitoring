name: "Data bug"
description: "Something in a table or notebook looks wrong."
type: "Bug"
projects: ["Buildabida/1"]
body:
  - type: input
    id: where
    attributes:
      label: "Where"
      placeholder: "Notebook or table name, like 02-silver.projects"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened"
      description: "What you ran, what you expected and what you got."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence"
      description: "Paste the query. Link a screenshot from our Drive folder."
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: "How bad is it?"
      options:
        - "It stops a run"
        - "The numbers are wrong"
        - "It looks odd, but the numbers are fine"
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: "Owner"
      description: "Who will fix it, if you know."
      placeholder: "@username"
