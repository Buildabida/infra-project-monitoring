name: Databricks preview

# Validates the dev bundle against the real workspace for pull requests that change
# what Databricks runs. It deploys a preview copy only when the team turns it on
# with the DATABRICKS_PREVIEW_DEPLOY variable. It never runs the pipeline, and it
# never touches the prod target.

on:
  pull_request:
    branches: [main]
    paths:
      - databricks.yml
      - resources/**
      - notebooks/**
      - src/**
      - .github/workflows/deploy-databricks-preview.yml

permissions:
  contents: read

# one preview at a time: all pull requests share the CI identity's dev copy
concurrency:
  group: databricks-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Validate dev bundle
    # skip, instead of failing, for pull requests from forks (they get no secrets) and
    # until the team sets DATABRICKS_HOST. Once it is set, missing settings fail below
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      ALERT_EMAIL: ${{ vars.DATABRICKS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check the GitHub configuration
        run: |
          missing=()
          [ -n "$DATABRICKS_HOST" ] || missing+=("variable DATABRICKS_HOST")
          if [ -z "$DATABRICKS_TOKEN" ] && { [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; }; then
            missing+=("secret DATABRICKS_TOKEN, or secrets DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET")
          fi
          [ -n "$ALERT_EMAIL" ] || missing+=("variable DATABRICKS_ALERT_EMAIL")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::The development environment is missing: %s\n' "${missing[@]}"
            echo "See docs/operations.md#github-configuration"
            exit 1
          fi

      - uses: databricks/setup-cli@a9304a5220bd6c59eadfd229a7c485dc352a5f98 # v0.278.0
        with:
          version: 0.278.0

      - name: Validate the dev bundle
        run: databricks bundle validate -t dev --var="alert_email=$ALERT_EMAIL"

      - name: Deploy the dev preview
        if: vars.DATABRICKS_PREVIEW_DEPLOY == 'true'
        run: databricks bundle deploy -t dev --var="alert_email=$ALERT_EMAIL" --fail-on-active-runs
