name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same pull request cancels the older run
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA, so a moved tag can't change what runs.
# The comment names the version the SHA had when it was pinned.
jobs:
  python:
    # The main branch rule looks for this exact name, so keep it when the job grows.
    name: Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Look for mistakes
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.9"
      - name: Check the format of our modules
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.9"
          args: "format --check --diff"
      - name: Install the test tool
        run: python -m pip install pytest==9.1.1
      # the quality-gate Spark scenarios skip here and run in the job below
      - name: Test the Python helpers
        run: python -m pytest -q

  quality-gate:
    name: Quality gate (Spark)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-spark.txt
      - name: Install Spark and Delta
        run: python -m pip install -r tests/requirements-spark.txt
      # runs the real gate notebook on local Spark against synthetic tables, never Databricks
      - name: Test the end-to-end quality gate scenarios
        run: python -m pytest -q tests/test_quality_gate.py

  bundle:
    name: Databricks bundle (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@a9304a5220bd6c59eadfd229a7c485dc352a5f98 # v0.278.0
        with:
          version: 0.278.0
      - run: python -m pip install pyyaml==6.0.3 jsonschema==4.25.1
      # no workspace login needed, so this runs on forks too
      - name: Check the bundle and job against the CLI schema
        run: |
          databricks bundle schema > "$RUNNER_TEMP/bundle-schema.json"
          python .github/scripts/check_bundle_schema.py "$RUNNER_TEMP/bundle-schema.json"

  sql:
    name: SQL (SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install sqlfluff==4.3.0
      - name: Look for mistakes
        run: sqlfluff lint notebooks --format github-annotation-native

  markdown:
    name: Markdown layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  writing:
    name: Writing tips
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
