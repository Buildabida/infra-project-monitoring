name: Databricks deploy

# Deploys the prod bundle after a merge to main changes what Databricks runs, or
# when someone starts it by hand. Deploying updates the job and its notebooks. It
# does not run the pipeline. A run starts only when run_pipeline is checked on a
# manual start, because a full run uses a large share of the daily quota.

on:
  push:
    branches: [main]
    paths:
      - databricks.yml
      - resources/**
      - notebooks/**
      - src/**
      - .github/workflows/deploy-databricks.yml
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: Start the full pipeline after the deploy
        type: boolean
        default: false

permissions:
  contents: read

# never cancel a deploy halfway, and never run two at once
concurrency:
  group: databricks-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prod bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # add required reviewers to this GitHub environment to approve each deploy
    environment: production
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      ALERT_EMAIL: ${{ vars.DATABRICKS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check the GitHub configuration
        run: |
          missing=()
          [ -n "$DATABRICKS_HOST" ] || missing+=("variable DATABRICKS_HOST")
          if [ -z "$DATABRICKS_TOKEN" ] && { [ -z "$DATABRICKS_CLIENT_ID" ] || [ -z "$DATABRICKS_CLIENT_SECRET" ]; }; then
            missing+=("secret DATABRICKS_TOKEN, or secrets DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET")
          fi
          [ -n "$ALERT_EMAIL" ] || missing+=("variable DATABRICKS_ALERT_EMAIL")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::The production environment is missing: %s\n' "${missing[@]}"
            echo "See docs/operations.md#github-configuration"
            exit 1
          fi

      - uses: databricks/setup-cli@a9304a5220bd6c59eadfd229a7c485dc352a5f98 # v0.278.0
        with:
          version: 0.278.0

      - name: Validate the prod bundle
        run: databricks bundle validate -t prod --var="alert_email=$ALERT_EMAIL"

      # stops instead of replacing notebooks under a pipeline run that is still going
      - name: Deploy the prod bundle
        run: databricks bundle deploy -t prod --var="alert_email=$ALERT_EMAIL" --fail-on-active-runs

      - name: Show what was deployed
        run: |
          summary="$(databricks bundle summary -t prod --var="alert_email=$ALERT_EMAIL")"
          printf '%s\n' "$summary"
          {
            echo "## Deployed Databricks resources"
            echo '```text'
            printf '%s\n' "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # starts the run and returns. Follow it in Databricks; failures email DATABRICKS_ALERT_EMAIL
      - name: Start the pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.run_pipeline
        run: databricks bundle run -t prod buildabida_full_pipeline --no-wait --var="alert_email=$ALERT_EMAIL"
